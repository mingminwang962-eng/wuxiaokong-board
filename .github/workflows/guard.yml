name: board-guard

# 守护：board.json / 页面是机器生成物，PR 禁止手改（补丁第六项）
on:
  pull_request:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 禁止手工修改生成物
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -E '^(board\.json|index\.html|dist/index\.html)$'; then
            echo "::error::board.json 与页面是纯生成物，只能由 sync_board.py 重建。请修改 plan.json 或源仓库 Issue/PR。"
            exit 1
          fi
